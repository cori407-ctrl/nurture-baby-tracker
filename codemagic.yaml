# Codemagic CI config for Nurture (Flutter) — builds Android + iOS in the cloud.
# Free tier: 500 build minutes/month. No Mac needed.
#
# HOW TO USE (Cori's steps):
#  1. Push this project to a GitHub repo.
#  2. Sign up at https://codemagic.io with GitHub, add the repo.
#  3. Builds run automatically — download the APK/IPA from the Codemagic dashboard.
#  4. For signed store builds, add your keystore / Apple certs in
#     Codemagic > Team settings > Code signing identities (her-steps only).

workflows:
  android-debug:
    name: Android Debug APK (for testing on your phone)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Set up keystore (debug uses default)
        script: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" || true
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android Release AAB (for Google Play upload)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials  # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Cori: create in Codemagic > Environment variables)
      android_signing:
        - keystore: nurture-release-keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up release keystore
        script: |
          # The release keystore is uploaded in Codemagic > Team settings > Code signing identities
          # as "nurture-release-keystore" and referenced via android_signing in this yaml.
          # Codemagic exposes it via CM_KEYSTORE_PATH, or FCI_KEYSTORE_PATH on newer infra.
          for VAR in CM_KEYSTORE_PATH FCI_KEYSTORE_PATH; do
            P=$(printenv "$VAR")
            if [ -n "$P" ] && [ -f "$P" ]; then
              echo "Using Codemagic code-signing keystore ($VAR)."
              export KEYSTORE_PATH="$P"
              break
            fi
          done
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "Using keystore from KEYSTORE_PATH."
          else
            echo "ERROR: No release keystore found." >&2
            echo "Upload nurture-release.keystore to Codemagic (Code signing identities" >&2
            echo "with reference name 'nurture-release-keystore'), then re-run." >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD (or CM_KEYSTORE_PASSWORD) is not set." >&2
            exit 1
          fi
          # Export for the build step
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $CM_ENV || true
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build release AAB
        script: |
          # Re-resolve keystore path (env vars don't persist across Codemagic script steps
          # unless exported via $CM_ENV, so resolve again here to be safe).
          if [ -z "$KEYSTORE_PATH" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            for VAR in CM_KEYSTORE_PATH FCI_KEYSTORE_PATH; do
              P=$(printenv "$VAR")
              if [ -n "$P" ] && [ -f "$P" ]; then
                export KEYSTORE_PATH="$P"
                break
              fi
            done
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          flutter build appbundle --release \
            --build-name=1.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  ios-debug:
    name: iOS Debug IPA (unsigned, for sideload testing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build unsigned iOS IPA
        script: |
          flutter build ipa --debug --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa

  ios-release:
    # Release IPA for App Store Connect upload (added 12 Oct 2026).
    # Trigger: push a tag like `ios-v1.0.0` (Codemagic > build > Start new build
    # also works). The IPA downloads from the build's Artifacts tab.
    name: iOS Release IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.nurturebaby.nurture"   # registered in App Store Connect 12 Oct 2026
        APP_STORE_TEAM_ID: "U842U9QDT4"        # Cori's Apple Developer Team ID
      groups:
        # REQUIRED (Cori: create once in Codemagic > Team settings > Environment variables):
        #   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        #   APP_STORE_CONNECT_PRIVATE_KEY  (from an App Store Connect API key with
        #   App Manager role — Codemagic uses it to fetch/create the distribution
        #   certificate + App Store provisioning profile automatically).
        #   CERTIFICATE_PRIVATE_KEY  (added 13 Oct 2026 — an RSA private key in PEM
        #   format, marked Secure. Without it, fetch-signing-files --create fails
        #   with "Cannot save Signing Certificates without certificate private key"
        #   because Apple never re-downloads a certificate's private key. Generate
        #   once, store ONLY as this secure Codemagic variable — never in the repo
        #   or in chat. See docs/ios-signing-fix-oct13.md.)
        - app_store_connect
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files (distribution cert + App Store profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply profiles to Xcode project
        script: xcode-project use-profiles
      - name: Write export options plist (profile UUID resolved at build time)
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          FETCHED_PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # Current codemagic-cli-tools save fetched provisioning profiles to the
          # Xcode UserData dir above; this step (and older Xcode tooling) looks in
          # the legacy MobileDevice dir. Sync the fetched profiles across so the
          # UUID lookup below finds them wherever the fetch step put them.
          mkdir -p "$PROFILES_DIR"
          cp "$FETCHED_PROFILES_DIR"/*.mobileprovision "$PROFILES_DIR/" 2>/dev/null || true
          PROFILE_FILE=$(ls "$PROFILES_DIR"/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            echo "ERROR: no provisioning profile found in $PROFILES_DIR" >&2
            exit 1
          fi
          # The .mobileprovision FILENAME is NOT the profile UUID
          # (fetch-signing-files names downloads IOS_APP_STORE_<id>_<rand>) —
          # the real UUID is the :UUID key inside the profile's signed plist.
          # Decode the profile and extract it; fail loudly if it is not a UUID.
          security cms -D -i "$PROFILE_FILE" > /tmp/decoded_profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/decoded_profile.plist)
          if ! echo "$PROFILE_UUID" | grep -Eq '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'; then
            echo "ERROR: extracted profile UUID does not look like a UUID: '$PROFILE_UUID' (from $PROFILE_FILE)" >&2
            exit 1
          fi
          echo "Using provisioning profile UUID: $PROFILE_UUID"
          cat > "$HOME/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APP_STORE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
      - name: Build release IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
      - name: Export IPA from archive
        script: |
          set -e
          # Build 5 (7d26760) proved the failure mode: the archive lands at
          # build/ios/archive/Runner.xcarchive with a complete signed app
          # inside, but flutter's own export (driven by the hand-written
          # $HOME/export_options.plist, method: app-store + legacy keys)
          # silently produces NO .ipa anywhere and still reports green.
          # Don't debug that black box — export the known-good archive
          # ourselves with xcodebuild and a fresh, modern export plist.
          # If flutter's export ever works too, Collect IPA just finds two.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          FETCHED_PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # Same profile resolution as the export-options step above: sync
          # the fetched profiles from the Xcode UserData dir into the legacy
          # MobileDevice dir, then extract the first profile's real UUID
          # from inside the file (its filename is not the UUID).
          mkdir -p "$PROFILES_DIR"
          cp "$FETCHED_PROFILES_DIR"/*.mobileprovision "$PROFILES_DIR/" 2>/dev/null || true
          PROFILE_FILE=$(ls "$PROFILES_DIR"/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_FILE" ]; then
            echo "ERROR: no provisioning profile found in $PROFILES_DIR" >&2
            exit 1
          fi
          # The .mobileprovision FILENAME is NOT the profile UUID
          # (fetch-signing-files names downloads IOS_APP_STORE_<id>_<rand>) —
          # the real UUID is the :UUID key inside the profile's signed plist.
          # Decode the profile and extract it; fail loudly if it is not a UUID.
          security cms -D -i "$PROFILE_FILE" > /tmp/decoded_profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/decoded_profile.plist)
          if ! echo "$PROFILE_UUID" | grep -Eq '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'; then
            echo "ERROR: extracted profile UUID does not look like a UUID: '$PROFILE_UUID' (from $PROFILE_FILE)" >&2
            exit 1
          fi
          echo "Exporting with provisioning profile UUID: $PROFILE_UUID"
          cat > "$HOME/export_options_fixed.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>U842U9QDT4</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nurturebaby.nurture</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "Generated export options plist:"
          cat "$HOME/export_options_fixed.plist"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: archive not found at $ARCHIVE_PATH" >&2
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$HOME/export_options_fixed.plist"
          echo "Export output:"
          ls -la "$CM_BUILD_DIR/build/ios/ipa"
      - name: Collect IPA
        script: |
          # Builds 3 AND 4 finished fully green incl. "Build release IPA",
          # yet Publishing said "No artifacts were found" both times — even
          # with $CM_BUILD_DIR-anchored globs. So the IPA is NOT landing in
          # build/ios/ipa relative to the repo root (or is never written).
          # Sweep the whole build tree for it, copy any hit into collected/,
          # and FAIL LOUDLY if there is none: a red build beats a silent
          # green one, and the find output below reveals the real path.
          mkdir -p "$CM_BUILD_DIR/collected"
          echo "Searching for *.ipa under $CM_BUILD_DIR ..."
          find "$CM_BUILD_DIR" -path "$CM_BUILD_DIR/collected" -prune -o \
            -path "$CM_BUILD_DIR/.git" -prune -o \
            -type f -name "*.ipa" -print
          find "$CM_BUILD_DIR" -path "$CM_BUILD_DIR/collected" -prune -o \
            -path "$CM_BUILD_DIR/.git" -prune -o \
            -type f -name "*.ipa" -exec cp -vf {} "$CM_BUILD_DIR/collected/" \;
          # Fallback: a shallow sweep of $HOME in case the export landed there.
          find "$HOME" -maxdepth 4 -type f -name "*.ipa" \
            -exec cp -vn {} "$CM_BUILD_DIR/collected/" \; 2>/dev/null || true
          COUNT=$(ls "$CM_BUILD_DIR/collected"/*.ipa 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no .ipa file found anywhere under $CM_BUILD_DIR or $HOME (maxdepth 4)." >&2
            echo "build/ios tree for diagnosis:" >&2
            find "$CM_BUILD_DIR/build/ios" 2>/dev/null | head -100 >&2
            exit 1
          fi
          echo "Collected $COUNT IPA(s):"
          ls -la "$CM_BUILD_DIR/collected"
    # `flutter build ipa` should write the IPA to build/ios/ipa/*.ipa, yet
    # builds 3 (73ddc43) and 4 (b385c82, with the anchored globs below) both
    # ended "No artifacts were found". The "Collect IPA" step above sweeps
    # the whole build tree into collected/ and fails the build if no IPA
    # exists at all; the collected/ pattern is the one that must hit.
    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
      - $CM_BUILD_DIR/collected/*.ipa
    # Publishing added 14 Oct 2026 at Cori's request ("TestFlight"): upload the
    # IPA to App Store Connect using the same API-key env group the signing
    # steps already use, and submit it to TestFlight. NOT for App Store
    # review — submit_to_app_store stays off; App Review submission always
    # needs Cori's fresh explicit confirmation.
    publishing:
      app_store_connect:
        submit_to_testflight: true
        submit_to_app_store: false
