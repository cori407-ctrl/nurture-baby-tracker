# Codemagic CI config for Nurture (Flutter) — builds Android + iOS in the cloud.
# Free tier: 500 build minutes/month. No Mac needed.
#
# HOW TO USE (Cori's steps):
#  1. Push this project to a GitHub repo.
#  2. Sign up at https://codemagic.io with GitHub, add the repo.
#  3. Builds run automatically — download the APK/IPA from the Codemagic dashboard.
#  4. For signed store builds, add your keystore / Apple certs in
#     Codemagic > Team settings > Code signing identities (her-steps only).

workflows:
  android-debug:
    name: Android Debug APK (for testing on your phone)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Set up keystore (debug uses default)
        script: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" || true
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android Release AAB (for Google Play upload)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials  # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Cori: create in Codemagic > Environment variables)
      android_signing:
        - keystore: nurture-release-keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up release keystore
        script: |
          # The release keystore is uploaded in Codemagic > Team settings > Code signing identities
          # as "nurture-release-keystore" and referenced via android_signing in this yaml.
          # Codemagic exposes it via CM_KEYSTORE_PATH, or FCI_KEYSTORE_PATH on newer infra.
          for VAR in CM_KEYSTORE_PATH FCI_KEYSTORE_PATH; do
            P=$(printenv "$VAR")
            if [ -n "$P" ] && [ -f "$P" ]; then
              echo "Using Codemagic code-signing keystore ($VAR)."
              export KEYSTORE_PATH="$P"
              break
            fi
          done
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "Using keystore from KEYSTORE_PATH."
          else
            echo "ERROR: No release keystore found." >&2
            echo "Upload nurture-release.keystore to Codemagic (Code signing identities" >&2
            echo "with reference name 'nurture-release-keystore'), then re-run." >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD (or CM_KEYSTORE_PASSWORD) is not set." >&2
            exit 1
          fi
          # Export for the build step
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $CM_ENV || true
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build release AAB
        script: |
          # Re-resolve keystore path (env vars don't persist across Codemagic script steps
          # unless exported via $CM_ENV, so resolve again here to be safe).
          if [ -z "$KEYSTORE_PATH" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            for VAR in CM_KEYSTORE_PATH FCI_KEYSTORE_PATH; do
              P=$(printenv "$VAR")
              if [ -n "$P" ] && [ -f "$P" ]; then
                export KEYSTORE_PATH="$P"
                break
              fi
            done
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          flutter build appbundle --release \
            --build-name=1.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  ios-debug:
    name: iOS Debug IPA (unsigned, for sideload testing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Build unsigned iOS IPA
        script: |
          flutter build ipa --debug --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa

  ios-release:
    # Release IPA for App Store Connect upload (added 12 Oct 2026).
    # Trigger: push a tag like `ios-v1.0.0` (Codemagic > build > Start new build
    # also works). The IPA downloads from the build's Artifacts tab.
    name: iOS Release IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.nurturebaby.nurture"   # registered in App Store Connect 12 Oct 2026
        APP_STORE_TEAM_ID: "U842U9QDT4"        # Cori's Apple Developer Team ID
      groups:
        # REQUIRED (Cori: create once in Codemagic > Team settings > Environment variables):
        #   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        #   APP_STORE_CONNECT_PRIVATE_KEY  (from an App Store Connect API key with
        #   App Manager role — Codemagic uses it to fetch/create the distribution
        #   certificate + App Store provisioning profile automatically).
        #   CERTIFICATE_PRIVATE_KEY  (added 13 Oct 2026 — an RSA private key in PEM
        #   format, marked Secure. Without it, fetch-signing-files --create fails
        #   with "Cannot save Signing Certificates without certificate private key"
        #   because Apple never re-downloads a certificate's private key. Generate
        #   once, store ONLY as this secure Codemagic variable — never in the repo
        #   or in chat. See docs/ios-signing-fix-oct13.md.)
        - app_store_connect
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: Flutter analyze
        script: flutter analyze || true
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files (distribution cert + App Store profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply profiles to Xcode project
        script: xcode-project use-profiles
      - name: Write export options plist (profile UUID resolved at build time)
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          FETCHED_PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # Current codemagic-cli-tools save fetched provisioning profiles to the
          # Xcode UserData dir above; this step (and older Xcode tooling) looks in
          # the legacy MobileDevice dir. Sync the fetched profiles across so the
          # UUID lookup below finds them wherever the fetch step put them.
          mkdir -p "$PROFILES_DIR"
          cp "$FETCHED_PROFILES_DIR"/*.mobileprovision "$PROFILES_DIR/" 2>/dev/null || true
          PROFILE_UUID=$(ls "$PROFILES_DIR" | head -1 | sed 's/\.mobileprovision$//')
          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: no provisioning profile found in $PROFILES_DIR" >&2
            exit 1
          fi
          echo "Using provisioning profile UUID: $PROFILE_UUID"
          cat > "$HOME/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APP_STORE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
      - name: Build release IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
    # `flutter build ipa` writes the IPA to build/ios/ipa/*.ipa, yet build 3
    # (73ddc43, fully green incl. this step) ended with "No artifacts were
    # found" — Codemagic resolves artifact globs relative to the workflow
    # working directory, so a lone relative pattern can silently match
    # nothing. The extra patterns anchor the same output from the build-dir
    # root and sweep build/ios recursively; non-matching globs are ignored.
    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
